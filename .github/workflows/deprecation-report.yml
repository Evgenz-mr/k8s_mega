name: kubernetes-deprecation-report
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report historical APIs
        run: |
          echo 'Historical/deprecated API references:'
          grep -RniE 'extensions/v1beta1|apps/v1beta1|apps/v1beta2|networking.k8s.io/v1beta1|policy/v1beta1|kind:[[:space:]]*PodSecurityPolicy' . --exclude-dir=.git || true
      - name: Ensure migration documentation exists
        run: test -s docs/VERSION_COMPATIBILITY.md && test -s docs/API_MIGRATION_EXERCISE.md
