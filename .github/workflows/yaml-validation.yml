name: yaml-validation
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Validate YAML syntax
        run: yamllint -d '{extends: relaxed, rules: {line-length: disable, document-start: disable}}' .
